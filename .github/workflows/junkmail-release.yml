# junkmail: builds the CLI archive for Apple Silicon and Intel Macs, publishes a GitHub release, and
# updates the Homebrew tap. Fork-owned; upstream's release.yml targets runners and secrets
# this fork does not have. Triggered by pushing a `junkmail-v<version>` tag, which
# scripts/junkmail/release.sh does.
name: junkmail release

on:
  push:
    tags:
      - "junkmail-v*"

permissions:
  contents: write

concurrency:
  group: junkmail-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CLI archive (macOS ${{ matrix.arch }})
    # Native runners per architecture: the single-executable is injected into the runner's
    # own Node, and a cross-built binary could not be smoke-tested.
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#junkmail-v}" >> "$GITHUB_OUTPUT"

      # The vendored .repos tree holds orphaned gitlinks that break checkout's cleanup.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/darwin-${{ matrix.arch }}"
          cp native/resource-monitor/target/release/t3-resource-monitor \
            "$RUNNER_TEMP/cli-resource-monitor/darwin-${{ matrix.arch }}/"

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build server and web client
        run: vp run --filter t3 build

      # Matches SEA_NODE_VERSION in apps/server/vite.config.ts, as upstream's release does.
      - name: Build CLI single-executable
        if: matrix.arch == 'arm64'
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      # The single-executable segfaults on darwin-x64 (upstream ships no Intel CLI either), so
      # Intel archives run the same server bundle on Node; the formula supplies an official build.
      - name: Stage Node launcher (Intel)
        if: matrix.arch == 'x64'
        run: |
          mkdir -p apps/server/dist-exe
          cat > apps/server/dist-exe/t3 <<'SH'
          #!/bin/sh
          exec "${JUNKMAIL_NODE:-node}" "${0%/*}/bin.mjs" "$@"
          SH
          chmod +x apps/server/dist-exe/t3

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform mac \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Add server bundle (Intel)
        if: matrix.arch == 'x64'
        run: |
          archive="$(ls release-cli/*.tar.gz)"
          stem="$(basename "$archive" .tar.gz)"
          work="$RUNNER_TEMP/repack"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          (cd apps/server/dist && find . -maxdepth 1 -name '*.mjs' -exec cp {} "$work/$stem/" \;)
          tar -czf "$archive" -C "$work" "$stem"

      - name: Smoke-test CLI archive
        if: matrix.arch == 'arm64'
        run: >-
          node scripts/smoke-cli-archive.ts
          --archive release-cli/*
          --expect-version "${{ steps.version.outputs.version }}"

      # Upstream's smoke test runs with an empty PATH, which a Node-hosted archive cannot pass.
      - name: Smoke-test CLI archive (Intel)
        if: matrix.arch == 'x64'
        timeout-minutes: 5
        run: |
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/home"
          tar -xzf release-cli/*.tar.gz -C "$work"
          cli="$(ls -d "$work"/t3-*)/t3"
          export JUNKMAIL_NODE="$(command -v node)" T3CODE_HOME="$work/home"
          "$cli" --version | grep -F "${{ steps.version.outputs.version }}"
          "$cli" serve --host 127.0.0.1 --port 47731 --no-browser > "$work/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:47731/; then
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          kill "$pid" || true
          cat "$work/server.log"
          echo "Server did not answer within 60 seconds" >&2
          exit 1

      - name: Checksum archive
        run: |
          cd release-cli
          for archive in *.tar.gz; do shasum -a 256 "$archive" > "$archive.sha256"; done

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#junkmail-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/junkmail
          sparse-checkout-cone-mode: true

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: release-cli
          merge-multiple: true

      - name: Render Homebrew formula
        run: |
          version="${{ steps.version.outputs.version }}"
          sha() { cut -d' ' -f1 "release-cli/t3-${version}-darwin-$1.tar.gz.sha256"; }
          node scripts/junkmail/render-formula.mjs "$version" "$(sha arm64)" "$(sha x64)" release-cli/junkmail.rb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-cli/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "junkmail ${{ steps.version.outputs.version }}" \
            --notes "Install: \`brew install komcdo/junkmail/junkmail\`" \
            --target "$GITHUB_SHA"

      # Optional: with a token that can push to komcdo/homebrew-junkmail, the tap updates
      # itself. Without it, scripts/junkmail/release.sh copies junkmail.rb into the tap.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/komcdo/homebrew-junkmail.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp release-cli/junkmail.rb "$RUNNER_TEMP/tap/Formula/junkmail.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "junkmail release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/junkmail.rb
          git commit -m "junkmail ${{ steps.version.outputs.version }}"
          git push
